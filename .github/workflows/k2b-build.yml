name: k2b-operator-build
# Pilot: Hoops Nuitka operator zip on tag v*-k2b* (e.g. v0.1-k2b-pilot).
# Windows Nuitka = primary operator download. Mac Nuitka = Mac track.
# Artifacts must contain zero *.py / frontend/src (asserted below).

on:
  push:
    tags:
      - "v*-k2b*"
  workflow_dispatch:

# New repos default GITHUB_TOKEN to read-only; the release step needs write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install freezer + runtime deps
        run: |
          pip install nuitka ordered-set zstandard
          # Nuitka compiles the app's imports into the binary, so the deps
          # MUST be installed before building (otherwise the exe ships without
          # uvicorn/fastapi and dies on launch).
          pip install -r requirements-k2b.txt
      - name: Check LFS levels are real
        shell: bash
        run: |
          test -f games/source/-/001.led
          head -c 20 games/source/-/001.led | grep -q "PK" || (echo "LFS pointer, not data" && exit 1)
      - name: Build operator stage
        shell: bash
        run: bash tools/k2b/build_nuitka.sh
      - name: Deny source in artifact
        shell: bash
        run: |
          if find stage-k2b -name '*.py' -print -quit | grep -q .; then
            echo "::error::SOURCE LEAK - .py file found in stage-k2b"; exit 1
          fi
          test ! -e stage-k2b/frontend || (echo "SOURCE LEAK - frontend dir" && exit 1)
          for d in hoops-api hoops-bridge supervisor; do
            test -d "stage-k2b/$d" || (echo "missing $d/ binary folder" && exit 1)
          done
          test -f "stage-k2b/supervisor/supervisor" || test -f "stage-k2b/supervisor/supervisor.exe" \
            || (echo "missing supervisor binary" && exit 1)
          test -d stage-k2b/ui || (echo "missing ui/" && exit 1)
          test -f stage-k2b/simulator/static/index.html || (echo "missing sim page" && exit 1)
          echo "stage verified: no .py, 3 binaries + ui + sim present"
      - name: Smoke test the frozen operator package
        shell: bash
        run: |
          # A binary that cannot boot must never ship. Compile success proves
          # nothing, so run the thing an operator double-clicks: the supervisor.
          # That exercises install-root discovery, env handoff, level loading
          # and the compiled game engine in one shot.
          PY=$(command -v python3 || command -v python)
          SUP=stage-k2b/supervisor/supervisor
          [ -f "$SUP" ] || SUP=stage-k2b/supervisor/supervisor.exe
          "$SUP" > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -m 3 http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf -m 5 http://127.0.0.1:8000/health || {
            echo "::error::supervisor never brought the API up"; tail -30 /tmp/smoke.log; exit 1; }
          COUNT=$(curl -sf -m 10 http://127.0.0.1:8000/levels | "$PY" -c "import sys,json;print(json.load(sys.stdin)['count'])")
          echo "levels visible: $COUNT"
          test "$COUNT" -gt 0 || { echo "::error::frozen build sees zero levels"; tail -20 /tmp/smoke.log; exit 1; }
          GID=$(curl -sf -m 10 -X POST http://127.0.0.1:8000/start-game -H 'Content-Type: application/json' \
            -d '{"card_id":"guest","level":"001","difficulty":"normal","player_count":1}' \
            | "$PY" -c "import sys,json;print(json.load(sys.stdin)['game_id'])")
          echo "started game $GID"
          sleep 12
          curl -sf -m 10 "http://127.0.0.1:8000/game-state/$GID" | "$PY" -c "
          import sys,json
          s=json.load(sys.stdin)['state']
          print('game_over:',s['game_over'],'elapsed:',round(s['time_elapsed'],1),'level:',s.get('current_level'))
          sys.exit(0 if not s['game_over'] else 1)" || { echo "::error::game died immediately - engine not compiled in"; exit 1; }
          curl -sf -m 5 -o /dev/null http://127.0.0.1:8765/static/index.html \
            || { echo "::error::bridge is not serving the simulator page"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //F //IM hoops-api.exe //T || true; taskkill //F //IM hoops-bridge.exe //T || true
          else
            pkill -f 'hoops-api' || true; pkill -f 'hoops-bridge' || true
          fi
          echo "smoke test passed: supervisor boots, engine runs, bridge serves"
      - name: Zip stage
        shell: bash
        run: |
          cd stage-k2b && (zip -qr ../hoops-k2b-${{ matrix.os }}.zip . || 7z a ../hoops-k2b-${{ matrix.os }}.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: hoops-k2b-${{ matrix.os }}
          path: hoops-k2b-${{ matrix.os }}.zip
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hoops-k2b-${{ matrix.os }}.zip
          body: "Hoops K2b pilot. Prefer the windows zip on floor PCs."
